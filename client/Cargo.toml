[package]
name = "givemedata-client"
version = "0.1.0"
edition = "2024"

[lib]
name = "gmd_client_native"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pyo3 = { version = "0.24.0", features = ["anyhow"] }
tch = "0.24.0"
pyo3-tch = "0.24.0"
bytes = "1.12.1"
flume = "0.11.1"
mime_guess = "2.0.5"
tar = "0.4.44"
tokio = { version = "1.44.2", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.19"
tonic = "0.13.1"
prost = "0.13.5"

[build-dependencies]
pyo3-build-config = "0.29.2"
protox = "0.7.2"
tonic-build = { version = "0.13.1", default-features = false, features = ["prost"] }
