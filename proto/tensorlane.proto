syntax = "proto3";

service TensorLane {
  rpc Init (InitRequest) returns (InitResponse);
  rpc Data (stream DataRequest) returns (stream DataResponse);
  rpc Asset (AssetRequest) returns (stream AssetResponse);
  rpc SaveAsset (stream SaveAssetRequest) returns (SaveAssetResponse);
  rpc Metrics (stream MetricsRequest) returns (MetricsResponse);
  rpc End (EndRequest) returns (EndResponse);
}
message InitRequest { string run_id = 1; }
message InitResponse {
  string run_id = 1;
  string config = 2;
  repeated string assets = 3;
  repeated string streams = 4;
}
message DataRequest {
  string run_id = 1;
  reserved 2;
  string stream = 3;
}
message Sample {
  reserved 1 to 5;
  string sample_id = 6;
  string metadata_json = 7;
  map<string, bytes> blobs = 8;
}
message DataResponse {
  repeated Sample batch = 1;
  string stream = 2;
  uint64 batch_id = 3;
  uint64 query_batch_idx = 4;
}
message AssetRequest { string run_id = 1; string name = 2; }
message AssetMetadata {
  optional string entrypoint = 1;
  optional string asset_id = 2;
  string metadata_json = 3;
  string kind = 4;
  string asset_type = 5;
}
message AssetResponse {
  oneof payload { AssetMetadata metadata = 1; bytes chunk = 2; }
}
message SaveAssetMetadata {
  string run_id = 1;
  string asset_id = 2;
  string name = 3;
  uint64 step = 4;
  string kind = 5;
  optional string asset_type = 6;
  string metadata_json = 7;
}
message SaveAssetRequest {
  oneof payload { SaveAssetMetadata metadata = 1; bytes chunk = 2; }
}
message SaveAssetResponse { string asset_id = 1; }

message MetricsStreamMetadata {
  string run_id = 1;
}

message ScalarMetric {
  uint64 step = 1;
  int64 timestamp_unix_ms = 2;
  string name = 3;
  float value = 4;
}

message ArrayMetric {
  uint64 step = 1;
  int64 timestamp_unix_ms = 2;
  string name = 3;
  repeated float value = 4;
}

message ArtifactMetric {
  uint64 step = 1;
  int64 timestamp_unix_ms = 2;
  string name = 3;
  string content_type = 4;
  uint64 size_bytes = 5;
}

message ArtifactChunk {
  bytes data = 1;
}

message MetricsRequest {
  oneof payload {
    MetricsStreamMetadata metadata = 1;
    ScalarMetric metric = 2;
    ArtifactMetric artifact = 3;
    ArtifactChunk artifact_chunk = 4;
    ArrayMetric array_metric = 5;
  }
}

message MetricsResponse {
  uint64 metrics_received = 1;
  uint64 artifacts_received = 2;
  uint64 artifact_bytes_received = 3;
  uint64 array_metrics_received = 4;
}

message EndRequest {
  string run_id = 1;
}

message EndResponse {}
